[project]
name = "congress-mcp"
version = "0.1.0"
description = "MCP server for the Congress.gov API"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28.1",
    "mcp>=2.3,<3",
    "starlette>=1.10.0",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.ruff]
line-length = 120
